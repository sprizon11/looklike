services:
  - type: web
    name: looklike
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: FRONTEND_DIST_DIR
        value: ./app/dist
      - key: DATA_DIR
        value: ./backend/data
      - key: UPI_ID
        value: 7695921699@okbizaxis
      - key: UPI_PAYEE_NAME
        value: Look Like
      - key: SHOP_WHATSAPP_PHONE
        value: "919344841180"
      - key: WHATSAPP_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
